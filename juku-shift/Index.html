<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>シフト管理</title>
<style>
:root {
  --bg: #f6f7fb; --card: #fff; --ink: #1f2430; --sub: #667085; --line: #e2e5ee;
  --accent: #4f46e5; --accent-weak: #eef0ff; --ok: #1a8f5a; --ok-weak: #e4f6ec;
  --warn: #c76a00; --warn-weak: #fff1de; --danger: #c9302c; --lesson: #7c3aed; --lesson-weak: #ede4ff;
  --sat: #2f6fdb; --sun: #d6453d;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.35; }
h2 { font-size: 18px; } h3 { font-size: 15px; }
.hidden { display: none !important; }
.muted { color: var(--sub); } .small { font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* ボタン */
.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 14px; min-height: 34px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: #f1f2f7; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #4338ca; }
.btn.danger { color: var(--danger); border-color: #efc1bf; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input[type=text], input[type=email], input[type=password], input[type=date], input[type=time], input[type=number], select, textarea {
  border: 1px solid #cfd4e2; border-radius: 8px; padding: 6px 10px; min-height: 34px; background: #fff; max-width: 100%;
}
input:focus, select:focus, textarea:focus, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--sub); }
.field > input, .field > select, .field > textarea { font-size: 14px; color: var(--ink); }

/* 画面の枠 */
.top { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--line); }
.top-in { max-width: 1360px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 17px; color: var(--accent); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--accent-weak); color: var(--accent); }
.badge.ok { background: var(--ok-weak); color: var(--ok); }
.badge.warn { background: var(--warn-weak); color: var(--warn); }
.badge.gray { background: #eceef4; color: var(--sub); }
.tabs { max-width: 1360px; margin: 0 auto; padding: 0 20px; display: flex; gap: 4px; }
.tab { border: 0; background: none; padding: 10px 16px; cursor: pointer; border-bottom: 3px solid transparent; color: var(--sub); font-weight: 600; }
.tab[aria-selected=true] { color: var(--accent); border-bottom-color: var(--accent); }
main { max-width: 1360px; margin: 0 auto; padding: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.monthnav { display: flex; align-items: center; gap: 6px; }
.monthnav b { min-width: 96px; text-align: center; font-size: 16px; }
.notice { padding: 10px 14px; border-radius: 8px; background: var(--accent-weak); }
.notice.warn { background: var(--warn-weak); color: #7a4300; }
.notice.ok { background: var(--ok-weak); color: #0f5e3a; }

/* ログイン */
.login { max-width: 380px; margin: 12vh auto 0; }
.login .card { display: flex; flex-direction: column; gap: 14px; padding: 24px; }
.err { color: var(--danger); min-height: 1.4em; font-size: 13px; }

/* 表 */
table.t { border-collapse: collapse; width: 100%; }
table.t th, table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.t th { font-size: 12px; color: var(--sub); font-weight: 600; background: #fafbfd; position: sticky; top: 0; }
table.t tr.dayrow td { background: #f3f4fa; font-weight: 700; }

/* 空き時間グリッド */
.gridwrap { overflow-x: auto; padding-bottom: 6px; }
table.grid { border-collapse: separate; border-spacing: 0; user-select: none; }
table.grid th, table.grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; }
table.grid thead th { background: #fafbfd; font-size: 12px; padding: 4px 0; min-width: 34px; cursor: pointer; border-top: 1px solid var(--line); }
table.grid thead th.corner { cursor: default; min-width: 56px; border-left: 1px solid var(--line); }
table.grid tbody th { background: #fafbfd; font-size: 12px; padding: 0 8px; cursor: pointer; border-left: 1px solid var(--line); white-space: nowrap; }
table.grid thead th small { display: block; font-weight: 400; }
table.grid th.sat { color: var(--sat); } table.grid th.sun { color: var(--sun); }
table.grid td { height: 32px; min-width: 34px; cursor: pointer; font-size: 15px; color: var(--accent); }
table.grid td.we { background: #fbfbfe; }
table.grid td.on { background: var(--accent-weak); font-weight: 700; }
table.grid td.on::after { content: "○"; }
table.grid td.lesson { background: var(--lesson-weak); color: var(--lesson); font-size: 11px; font-weight: 700; }
table.grid td.lesson::after { content: "授"; }
table.grid.ro td { cursor: default; }
table.grid td.out { background: repeating-linear-gradient(45deg, #f3f3f6, #f3f3f6 4px, #fff 4px, #fff 8px); cursor: default; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--sub); align-items: center; }
.legend i { display: inline-block; width: 16px; height: 16px; border-radius: 4px; vertical-align: -3px; margin-right: 4px; border: 1px solid var(--line); }

/* マッチング */
.split { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
.slist { display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 220px); overflow: auto; }
.sitem { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.sitem:hover { background: #f6f7ff; }
.sitem[aria-current=true] { border-color: var(--accent); background: var(--accent-weak); }
.sitem b { font-size: 15px; }
.req { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: #fff; display: flex; flex-direction: column; gap: 8px; }
.req.done { background: var(--ok-weak); border-color: #bfe5cf; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { background: #eceef4; border-radius: 6px; padding: 1px 8px; font-size: 13px; }
.chip.main { background: var(--accent-weak); color: var(--accent); font-weight: 700; }
.cands { display: flex; flex-direction: column; gap: 6px; }
.cand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px dashed #c9cdea; border-radius: 8px; padding: 6px 10px; background: #fcfcff; }
.cand b { min-width: 72px; }
.reqrow { display: grid; grid-template-columns: 100px 130px 150px 290px 100px 170px minmax(120px,1fr) auto; gap: 8px; align-items: end; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.reqrow .row { flex-wrap: nowrap; }
.reqrow input[type=time] { width: 124px; padding: 6px 6px; }
.reqrow.done { border-color: #bfe5cf; background: #f7fcf9; }

/* モーダル */
.overlay { position: fixed; inset: 0; background: rgba(20, 24, 40, .45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; z-index: 50; overflow: auto; }
.modal { background: #fff; border-radius: 14px; width: 100%; max-width: 560px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal.wide { max-width: 720px; }
.formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.formgrid .full { grid-column: 1 / -1; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--ink); font-size: 14px; }
.checks label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #1f2430; color: #fff; padding: 10px 18px; border-radius: 10px; z-index: 80; max-width: 80vw; }
.toast.err { background: var(--danger); }

.printtitle { display: none; }
@media print {
  .noprint, .top, .tabs { display: none !important; }
  .printtitle { display: block; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  body { background: #fff; }
  main { padding: 0; max-width: none; }
  .card { border: 0; padding: 0; }
}
@media (max-width: 1100px) { .split { grid-template-columns: 1fr; } .reqrow { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ========== 小さな道具 ========== */
function h(tag, attrs) {
  var e = document.createElement(tag), after = null;
  if (attrs) Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') e.className = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else if (k === 'value') after = v;
    else if (k === 'checked' || k === 'disabled' || k === 'readOnly') e[k] = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++) add(e, arguments[i]);
  if (after !== null) e.value = after;
  return e;
}
function add(e, c) {
  if (c === null || c === undefined || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { add(e, x); }); return; }
  e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
}
function opts(list, value) { return list.map(function (o) { var v = o.v !== undefined ? o.v : o; var l = o.l !== undefined ? o.l : o; return h('option', { value: v }, l); }); }
function select(list, value, onchange, extra) { var s = h('select', Object.assign({ onchange: onchange }, extra || {}), opts(list)); s.value = value; return s; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
var DOW = ['日', '月', '火', '水', '木', '金', '土'];
function dowOf(d) { var m = d.split('-'); return new Date(Date.UTC(+m[0], +m[1] - 1, +m[2])).getUTCDay(); }
function fmtDate(d) { return (+d.slice(5, 7)) + '/' + (+d.slice(8, 10)) + '(' + DOW[dowOf(d)] + ')'; }
function fmtMonth(m) { return m.slice(0, 4) + '年' + (+m.slice(5)) + '月'; }
function daysOf(m) { var y = +m.slice(0, 4), mo = +m.slice(5), n = new Date(y, mo, 0).getDate(), a = []; for (var i = 1; i <= n; i++) a.push(m + '-' + pad(i)); return a; }
function addMonth(m, k) { var y = +m.slice(0, 4), mo = +m.slice(5) - 1 + k; return new Date(y, mo, 1).getFullYear() + '-' + pad(new Date(y, mo, 1).getMonth() + 1); }
function toMin(t) { return +t.slice(0, 2) * 60 + +t.slice(3, 5); }
function fmtMin(n) { return pad(Math.floor(n / 60)) + ':' + pad(n % 60); }
function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function weekStart(date) { var m = date.split('-'), d = new Date(Date.UTC(+m[0], +m[1] - 1, +m[2])); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); }
function toast(msg, isErr) {
  var t = h('div', { class: 'toast' + (isErr ? ' err' : ''), role: 'status' }, msg);
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, isErr ? 5000 : 2200);
}

/* ========== 状態と通信 ========== */
var S = { token: null, me: null, cfg: null, grades: [], teachers: [], month: today().slice(0, 7), data: null, tab: 'match', sel: null, dirty: false, tsel: null };
var app = document.getElementById('app');

function saveToken(t) { try { if (t) sessionStorage.setItem('shift_token', t); else sessionStorage.removeItem('shift_token'); } catch (e) { /* ignore */ } }
function loadToken() { try { return sessionStorage.getItem('shift_token'); } catch (e) { return null; } }

function call(action, payload) {
  return new Promise(function (resolve) {
    try {
      google.script.run
        .withSuccessHandler(function (r) { if (r && r.auth && S.token) { toLogin('もう一度ログインしてください'); } resolve(r || { ok: false, error: '応答がありません' }); })
        .withFailureHandler(function () { resolve({ ok: false, error: '通信に失敗しました。もう一度試してください' }); })
        .api(action, S.token, payload || {});
    } catch (e) { resolve({ ok: false, error: '通信に失敗しました' }); }
  });
}
async function act(action, payload, okMsg) {
  var r = await call(action, payload);
  if (!r.ok) { toast(r.error, true); return null; }
  if (okMsg) toast(okMsg);
  return r;
}

/* ========== ログイン ========== */
function toLogin(msg) {
  S.token = null; S.me = null; S.data = null; S.dirty = false; saveToken(null);
  document.title = 'シフト管理';
  var err = h('div', { class: 'err', role: 'alert' }, msg || '');
  var email = h('input', { type: 'email', autocomplete: 'username', required: true });
  var pw = h('input', { type: 'password', autocomplete: 'current-password', required: true });
  var btn = h('button', { class: 'btn primary', type: 'submit' }, 'ログイン');
  var form = h('form', { class: 'card', onsubmit: async function (ev) {
    ev.preventDefault(); btn.disabled = true; err.textContent = '';
    var r = await call('login', { email: email.value, password: pw.value });
    btn.disabled = false;
    if (!r.ok) { err.textContent = r.error; pw.value = ''; return; }
    S.token = r.data.token; saveToken(S.token);
    start();
  } },
    h('h2', null, '個別指導塾 シフト管理'),
    h('div', { class: 'muted small' }, '配られたメールアドレスとパスワードでログインしてください。'),
    h('label', { class: 'field' }, 'メールアドレス', email),
    h('label', { class: 'field' }, 'パスワード', pw),
    err, btn);
  app.replaceChildren(h('div', { class: 'login' }, form));
  email.focus();
}

async function start() {
  var r = await call('me');
  if (!r.ok) { toLogin(); return; }
  S.me = r.data.user; S.cfg = r.data.settings; S.grades = r.data.grades; S.teachers = r.data.teachers || [];
  S.tab = S.me.role === 'admin' ? 'match' : 'main';
  await loadMonth();
}

async function loadMonth() {
  var r = await call(S.me.role === 'admin' ? 'board' : 'mine', { month: S.month });
  if (!r.ok) { if (!r.auth) toast(r.error, true); return; }
  S.data = r.data; S.dirty = false;
  if (S.me.role === 'admin') S.cfg = r.data.settings;
  render();
}

/* ========== 共通の枠 ========== */
function render() {
  var role = S.me.role;
  var isAdmin = role === 'admin';
  var tabs = isAdmin ? [['match', 'マッチング'], ['sched', '時間割'], ['teachers', 'アルバイトの空き'], ['users', 'ユーザー'], ['settings', '設定']] : [];
  var monthTabs = !isAdmin || ['match', 'sched', 'teachers', 'settings'].indexOf(S.tab) >= 0;
  var top = h('div', { class: 'top noprint' },
    h('div', { class: 'top-in' },
      h('span', { class: 'brand' }, 'シフト管理'),
      monthTabs ? h('div', { class: 'monthnav' },
        h('button', { class: 'btn', 'aria-label': '前の月', onclick: function () { gotoMonth(-1); } }, '◀'),
        h('b', null, fmtMonth(S.month)),
        h('button', { class: 'btn', 'aria-label': '次の月', onclick: function () { gotoMonth(1); } }, '▶')) : null,
      h('span', { class: 'spacer' }),
      h('span', null, S.me.name), h('span', { class: 'badge' }, { admin: '管理者', teacher: 'アルバイト', parent: '保護者' }[role]),
      h('button', { class: 'btn', onclick: pwModal }, 'パスワード変更'),
      h('button', { class: 'btn', onclick: async function () { await call('logout'); toLogin(); } }, 'ログアウト')),
    tabs.length ? h('div', { class: 'tabs', role: 'tablist' }, tabs.map(function (t) {
      return h('button', { class: 'tab', role: 'tab', 'aria-selected': S.tab === t[0], onclick: function () { S.tab = t[0]; render(); } }, t[1]);
    })) : null);
  var body = h('main', null);
  if (role === 'teacher') body.appendChild(teacherView());
  else if (role === 'parent') body.appendChild(parentView());
  else body.appendChild({ match: matchView, sched: schedView, teachers: teachersView, users: usersView, settings: settingsView }[S.tab]());
  app.replaceChildren(top, body);
  document.title = 'シフト管理 - ' + fmtMonth(S.month);
}
async function gotoMonth(k) {
  if (S.dirty && !confirm('保存していない変更があります。破棄して移動しますか?')) return;
  S.month = addMonth(S.month, k); await loadMonth();
}

function deadlineNote(deadline, locked) {
  if (!deadline) return h('div', { class: 'notice' }, 'この月の提出締切はまだ決まっていません。');
  if (locked) return h('div', { class: 'notice warn' }, '締切(' + fmtDate(deadline) + ')を過ぎているため、変更できません。変更したいときは管理者に連絡してください。');
  return h('div', { class: 'notice' }, '提出の締切: ' + fmtDate(deadline) + ' まで');
}

/* ---------- モーダル ---------- */
function modal(title, body, buttons, wide) {
  var ov = h('div', { class: 'overlay', onmousedown: function (e) { if (e.target === ov) close(); } });
  function close() { ov.remove(); document.removeEventListener('keydown', onkey); }
  function onkey(e) { if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', onkey);
  ov.appendChild(h('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('h2', null, title), body, h('div', { class: 'row' }, buttons(close))));
  document.body.appendChild(ov);
  var f = ov.querySelector('input,select,textarea'); if (f) f.focus();
  return close;
}

function pwModal() {
  var o = h('input', { type: 'password', autocomplete: 'current-password' });
  var n = h('input', { type: 'password', autocomplete: 'new-password' });
  var err = h('div', { class: 'err', role: 'alert' });
  modal('パスワード変更', h('div', { class: 'stack' },
    h('label', { class: 'field' }, 'いまのパスワード', o),
    h('label', { class: 'field' }, '新しいパスワード(8文字以上)', n), err), function (close) {
    return [h('button', { class: 'btn primary', onclick: async function () {
      var r = await call('changePassword', { oldPassword: o.value, newPassword: n.value });
      if (!r.ok) { err.textContent = r.error; return; }
      close(); toast('パスワードを変更しました');
    } }, '変更する'), h('button', { class: 'btn', onclick: close }, 'キャンセル')];
  });
}

/* ========== 空き時間グリッド ========== */
var gridUp = null;
function lessonCovers(l, hour) { return toMin(l.start) < (hour + 1) * 60 && toMin(l.end) > hour * 60; }

function availGrid(o) {
  // o: { month, slots:Set, lessons:[], editable, onChange }
  var days = daysOf(o.month), hf = S.cfg.hourFrom, ht = S.cfg.hourTo, hours = [];
  for (var x = hf; x < ht; x++) hours.push(x);
  var key = function (d, hr) { return d + ':' + hr; };
  var cells = {};
  function paint(d, hr, on) {
    var k = key(d, hr);
    if (on) o.slots.add(k); else o.slots.delete(k);
    cells[k].classList.toggle('on', on);
  }
  function changed() { if (o.onChange) o.onChange(); }
  var thead = h('tr', null, h('th', { class: 'corner' }, ''), days.map(function (d) {
    var w = dowOf(d);
    return h('th', { class: w === 0 ? 'sun' : w === 6 ? 'sat' : '', title: o.editable ? 'クリックでこの日を全部切り替え' : '', onclick: function () {
      if (!o.editable) return;
      var all = hours.every(function (hr) { return o.slots.has(key(d, hr)); });
      hours.forEach(function (hr) { paint(d, hr, !all); }); changed();
    } }, +d.slice(8), h('small', null, DOW[w]));
  }));
  var tbody = hours.map(function (hr) {
    return h('tr', null,
      h('th', { title: o.editable ? 'クリックでこの時間を全部切り替え' : '', onclick: function () {
        if (!o.editable) return;
        var all = days.every(function (d) { return o.slots.has(key(d, hr)); });
        days.forEach(function (d) { paint(d, hr, !all); }); changed();
      } }, pad(hr) + ':00'),
      days.map(function (d) {
        var w = dowOf(d), k = key(d, hr);
        var td = h('td', { class: (w === 0 || w === 6 ? 'we ' : '') + (o.slots.has(k) ? 'on ' : '') + ((o.lessons || []).some(function (l) { return l.date === d && lessonCovers(l, hr); }) ? 'lesson' : ''),
          'data-d': d, 'data-h': hr });
        cells[k] = td; return td;
      }));
  });
  var table = h('table', { class: 'grid' + (o.editable ? '' : ' ro'), 'aria-label': '空き時間(' + fmtMonth(o.month) + ')' }, h('thead', null, thead), h('tbody', null, tbody));
  if (o.editable) {
    var painting = null;
    table.addEventListener('mousedown', function (e) {
      var td = e.target.closest('td[data-d]'); if (!td) return;
      e.preventDefault();
      painting = !o.slots.has(key(td.dataset.d, +td.dataset.h));
      paint(td.dataset.d, +td.dataset.h, painting); changed();
    });
    table.addEventListener('mouseover', function (e) {

/** 希望1件に対する先生の候補を計算する */
function candidatesFor(r) {
  var stu = uById(r.studentId), L = r.len, w0 = toMin(r.from), w1 = toMin(r.to);
  var stuBusy = S.data.lessons.filter(function (l) { return l.date === r.date && l.studentId === r.studentId; }).map(function (l) { return [toMin(l.start), toMin(l.end)]; });
  var list = [], subjOk = 0;
  teachersOf().forEach(function (t) {
    if (t.subjects.indexOf(r.subject) < 0) return;
    if (t.grades.length && stu && t.grades.indexOf(stu.grade) < 0) return;
    subjOk++;
    var iv = mergeIv(availHours(t.id, r.date));
    var busy = S.data.lessons.filter(function (l) { return l.date === r.date && l.teacherId === t.id; }).map(function (l) { return [toMin(l.start), toMin(l.end)]; }).concat(stuBusy);
    var ok = [];
    for (var s = w0; s + L <= w1; s += 5) {
      if (iv.some(function (x) { return x[0] <= s && s + L <= x[1]; }) && !busy.some(function (x) { return x[0] < s + L && s < x[1]; })) ok.push(s);
    }
    if (!ok.length) return;
    var wk = weekCount(t.id, r.date);
    list.push({ teacher: t, start: ok[0], last: ok[ok.length - 1], len: L, pref: r.teacherId === t.id, wk: wk, over: t.maxPerWeek > 0 && wk >= t.maxPerWeek });

  var why = '';

function csvModal(ls) {
  function q(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  var rows = [['日付', '曜日', '開始', '終了', '先生', '生徒', '学年', '科目', 'メモ']].concat(ls.map(function (l) {
    var t = uById(l.teacherId), s = uById(l.studentId);
    return [l.date, DOW[dowOf(l.date)], l.start, l.end, t ? t.name : '', s ? s.name : '', s ? s.grade : '', l.subject, l.note];
  }));
  var csv = rows.map(function (r) { return r.map(q).join(','); }).join('\r\n');
  var ta = h('textarea', { rows: 10, readOnly: true, style: 'width:100%;font-family:monospace;font-size:12px' });
  ta.value = csv;
  modal('CSV出力', h('div', { class: 'stack' }, h('div', { class: 'muted small' }, 'ダウンロードできない場合は、コピーしてExcel等に貼り付けてください。'), ta), function (close) {
    return [h('button', { class: 'btn primary', onclick: function () {
      try {
        var a = h('a', { href: URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' })), download: '時間割_' + S.month + '.csv' });
        document.body.appendChild(a); a.click(); a.remove();
      } catch (e) { toast('ダウンロードできませんでした。コピーを使ってください', true); }
    } }, 'ダウンロード'), h('button', { class: 'btn', onclick: function () {
      ta.select();
      (navigator.clipboard ? navigator.clipboard.writeText(csv) : Promise.reject()).then(function () { toast('コピーしました'); }, function () { document.execCommand('copy'); toast('コピーしました'); });
    } }, 'コピー'), h('button', { class: 'btn', onclick: close }, '閉じる')];
  }, true);
}

/* ========== 管理者: ユーザー ========== */
function usersView() {
  var D = S.data;
  function table(role) {
    var us = D.users.filter(function (u) { return u.role === role; });
    var cols = role === 'teacher' ? ['名前', 'メール', '担当科目', '学年', '週の上限', ''] : ['生徒名', 'メール', '学年', 'メモ', ''];

        return role === 'teacher'

      h('div', { class: 'muted small' }, '1つのアカウントが1人の生徒です。兄弟姉妹は別々に登録してください。'), table('parent')));
}
function userModal(u) {
  var isNew = !u.id, isT = u.role === 'teacher';
  var name = h('input', { type: 'text', maxlength: 40, value: u.name || '' });
  var email = h('input', { type: 'email', value: u.email || '', autocomplete: 'off' });
  var pw = h('input', { type: 'password', autocomplete: 'new-password', placeholder: isNew ? '8文字以上' : '変えるときだけ入力' });
  var memo = h('input', { type: 'text', maxlength: 200, value: u.memo || '' });
  var grade = select(S.grades, u.grade || S.grades[0]);
  var mx = h('input', { type: 'number', min: 0, max: 50, value: u.maxPerWeek || '', placeholder: '空なら制限なし' });
  function checks(list, chosen) {
    var boxes = list.map(function (x) { return h('input', { type: 'checkbox', value: x, checked: chosen.indexOf(x) >= 0 }); });
    var el = h('div', { class: 'checks' }, boxes.map(function (b) { return h('label', null, b, b.value); }));
    el.values = function () { return boxes.filter(function (b) { return b.checked; }).map(function (b) { return b.value; }); };
    return el;
  }
  var subj = checks(S.cfg.subjects, u.subjects || []), gr = checks(S.grades, u.grades || []);
  var err = h('div', { class: 'err', role: 'alert' });
  modal((isNew ? '追加: ' : '編集: ') + (isT ? 'アルバイト' : '生徒'), h('div', { class: 'formgrid' },
    h('label', { class: 'field' }, isT ? '名前' : '生徒の名前', name),
    h('label', { class: 'field' }, 'メールアドレス(ログインID)', email),
    h('label', { class: 'field full' }, isNew ? '最初のパスワード' : '新しいパスワード', pw),
    isT ? [h('div', { class: 'field full' }, h('span', null, '教えられる科目'), subj), h('div', { class: 'field full' }, h('span', null, '教えられる学年(未選択なら全学年)'), gr),
      h('label', { class: 'field' }, '週の最大コマ数', mx)] : h('label', { class: 'field' }, '学年', grade),
    h('label', { class: 'field full' }, isT ? 'メモ(管理者だけが見られます)' : 'メモ(保護者名など。管理者だけが見られます)', memo), h('div', { class: 'full' }, err)), function (close) {
    var b = [h('button', { class: 'btn primary', onclick: async function () {
      var r = await call('saveUser', { id: u.id, role: u.role, name: name.value, email: email.value, password: pw.value, memo: memo.value,
        grade: grade.value, subjects: subj.values(), grades: gr.values(), maxPerWeek: mx.value });
      if (!r.ok) { err.textContent = r.error; return; }

    if (!isNew) b.push(h('span', { class: 'spacer' }), h('button', { class: 'btn danger', onclick: async function () {
      if (!confirm(u.name + ' を削除しますか?この人の希望・空き・授業の記録も消えます。')) return;
      var r = await act('deleteUser', { id: u.id }, '削除しました'); if (r) { close(); await loadMonth(); }
    } }, '削除'));
    return b;
  });
}

/* ========== 管理者: 設定 ========== */
